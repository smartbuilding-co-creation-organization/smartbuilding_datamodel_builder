name: Feature request
description: Propose a focused improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: purpose
    attributes:
      label: Purpose
      description: What user problem should this solve?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Proposed scope
      description: Include goals, non-goals, and acceptance criteria suitable for plans.md.
    validations:
      required: true
